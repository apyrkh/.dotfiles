name: Bootstrap

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/dual-platform-bootstrap
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/docker/Dockerfile .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh scripts/*.sh tests/mac-smoke.sh
      - run: bash tests/mac-smoke.sh
